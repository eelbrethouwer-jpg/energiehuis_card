<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Energiehuis Premium Cockpit F2</title>
<style>
:root{
  --bg:#04090F; --ink:#EEF4FA; --ink2:#A9BBCB; --ink3:#7F93A6;
  --glass:rgba(10,20,34,.62); --line:rgba(255,255,255,.10);
  --sun:#FFC23D; --export:#4BE38A; --import:#FF8A5B; --ev:#33DDFF; --praktijk:#7CB8FF; --battery:#B07CFF; --house:#FFE2B8; --idle:#7D8C99; --kpn:#5BE13A;
  --radius-l:22px; --radius-m:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(120% 60% at 50% 0%,#0E1E33 0%,#060D17 55%,#04090F 100%)}
button{font:inherit;color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding:16px 32px 32px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- host chrome ---------- */
.ck-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 4px 14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-icon{width:34px;height:34px;color:var(--ink);flex:none}
.brand-icon svg{width:100%;height:100%}
h1{font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:0}
h1 span{font-weight:500;color:var(--ink2);margin-left:6px}
.head-right{display:flex;align-items:center;gap:16px;flex:none}
time{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:15px}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:650;font-size:14px;cursor:pointer}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.pill[data-tone=ok]{border-color:#4BE38A66;background:#4BE38A14;color:#B9F7D0}.pill[data-tone=ok] i{background:var(--export);box-shadow:0 0 10px var(--export)}
.pill[data-tone=warn]{border-color:#FFC23D55;background:#FFC23D10;color:#FFE3A1}.pill[data-tone=warn] i{background:var(--sun)}
.pill[data-tone=bad]{border-color:#FF6B5B77;background:#FF6B5B18;color:#FFC4BB}.pill[data-tone=bad] i{background:#FF6B5B}
.pill[data-tone=demo]{border-color:#B07CFF77;background:#B07CFF1C;color:#E3D2FF}.pill[data-tone=demo] i{background:var(--battery)}
.band{margin:0 0 10px;padding:9px 14px;border-radius:12px;font-weight:700;font-size:14px;letter-spacing:.01em}
.band[data-kind=demo]{background:repeating-linear-gradient(135deg,#3A2470 0 14px,#2F1D5C 14px 28px);color:#F1E8FF;border:1px solid #B07CFF88}
.band[data-kind=test]{background:#2A2410;color:#FFE7A6;border:1px solid #FFC23D66}
.summary{margin:14px 4px 6px;font-size:17px;line-height:1.45;color:var(--ink);max-width:70ch}
.warnings{list-style:none;margin:8px 0;padding:0;display:grid;gap:6px}
.warnings li{padding:10px 14px;border-radius:12px;background:#FFC23D14;border:1px solid #FFC23D55;color:#FFE7A6;font-size:14px}
.warnings li[data-critical=true]{background:#FF6B5B18;border-color:#FF6B5B77;color:#FFD0C8}
.below{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-top:14px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius-m);padding:18px 20px}
.panel h2{font-size:16px;margin:0 0 6px;letter-spacing:-.01em}
.panel p{margin:0 0 12px;color:var(--ink2);font-size:14px}
.flags{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px;font-size:14px}
.flags li{display:flex;gap:10px;align-items:flex-start;color:var(--ink2)}
.flags li i{flex:none;width:16px;height:16px;margin-top:2px;border-radius:50%;border:2px solid var(--idle)}
.flags li[data-ok=true]{color:var(--ink)}.flags li[data-ok=true] i{border-color:var(--export);background:radial-gradient(circle,var(--export) 40%,transparent 45%)}
.flags.big li span{display:grid;gap:2px}.flags.big small{color:var(--ink3);font-size:13px}
.ghost{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:600;cursor:pointer}
.legend ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:14px;color:var(--ink2)}
.legend i{display:inline-block;width:26px;height:4px;border-radius:2px;background:var(--c);box-shadow:0 0 8px var(--c);vertical-align:middle;margin-right:10px}
.legend i.dotted{background:none;box-shadow:none;border-top:3px dotted var(--c);height:0}

/* ---------- stage (island) ---------- */
.stage{position:relative;width:100%;aspect-ratio:var(--ar,2/1);border-radius:var(--radius-l);overflow:hidden;background:#071020;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);isolation:isolate}
.scene,.particles{position:absolute;inset:0;width:100%;height:100%;display:block}
.particles{pointer-events:none}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(2,6,12,.55) 100%)}

.route .r-groove{fill:none;stroke:#020507;stroke-opacity:.7;stroke-width:9;stroke-linecap:round}
.route .r-core{fill:none;stroke:var(--c,#7D8C99);stroke-opacity:.34;stroke-width:2.4;stroke-linecap:round;transition:stroke .8s,stroke-opacity .8s}
.route .r-glow{fill:none;stroke:var(--c);stroke-width:8;stroke-linecap:round;opacity:0;filter:url(#fBlur6);transition:opacity .8s}
.route .r-chev{display:none}
.route.route-sun .r-core,.route.route-battery .r-core{stroke-dasharray:2 7}
.route[data-state=active] .r-core{stroke-opacity:.75;stroke-width:3}
.route[data-state=active] .r-glow{opacity:calc(.15 + var(--i,0) * .35)}
.route[data-state=hidden]{display:none}
.route-battery .r-core{stroke:var(--battery);stroke-opacity:.6;stroke-dasharray:1 9;stroke-width:3}
.route-battery[data-state=off] .r-core{stroke-opacity:.15}

.tiles{position:absolute;inset:0;z-index:2}
.tile{position:absolute;left:0;top:0;display:grid;gap:2px;text-align:left;cursor:pointer;padding:14px 16px;border-radius:var(--radius-m);
  background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
  border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);
  box-shadow:inset 0 1px 0 color-mix(in srgb,var(--accent) 45%,transparent),0 12px 30px rgba(0,0,0,.45),0 0 26px color-mix(in srgb,var(--accent) 18%,transparent);
  transition:border-color .6s,box-shadow .6s,opacity .6s}
.tile:focus-visible{outline:3px solid #fff;outline-offset:3px}
.t-head{display:flex;align-items:center;gap:10px;min-width:0}
.t-icon{width:28px;height:28px;color:var(--accent);flex:none;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 60%,transparent))}
.t-icon svg{width:100%;height:100%}
.t-name{font-size:15px;font-weight:650;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-tag{margin-left:auto;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#B07CFF2E;color:#E3D2FF;border:1px solid #B07CFF66}
.t-val{font-size:32px;line-height:1.1;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--accent);margin-top:6px}
.t-sub{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-simshort{display:none;font-size:11px;color:#D9C6FF}
.t-bar{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:8px;overflow:hidden}
.t-bar i{display:block;height:100%;background:linear-gradient(90deg,#7B4DE0,var(--battery));border-radius:3px;transition:width .8s}
.tile[data-tone=off]{--accent:var(--idle)!important}
.tile[data-tone=warn]{--accent:#FF6B5B!important}
.tile[data-tone=warn] .t-val{color:#FFB3A8}
.tile[data-tone=off] .t-val{color:var(--ink3)}
.tile[data-tone=dim] .t-val{opacity:.6}
.t-sun{--accent:var(--sun);width:300px}
.t-battery{--accent:var(--battery);width:300px}
.t-praktijk{--accent:var(--praktijk);width:250px}
.t-net{--accent:var(--idle);width:270px}
.t-net[data-dir=export]{--accent:var(--export)}.t-net[data-dir=import]{--accent:var(--import)}.t-net[data-dir=balance]{--accent:var(--ink2)}
.t-cupra{--accent:var(--kpn);width:270px}
.t-cupra .t-val{color:var(--ev)}
.t-house{--accent:var(--house);display:flex;align-items:center;gap:12px;padding:10px 16px 10px 12px;background:rgba(14,12,10,.66)}
.t-house .t-icon{width:30px;height:30px}
.t-house .t-text{display:grid}
.t-house .t-name{font-size:13px;color:var(--ink2);font-weight:600}
.t-house .t-val{font-size:26px;margin:0;color:var(--house)}
.t-house .t-sub{font-size:12px}

/* tablet */
.stage[data-comp=tablet] .tile{padding:10px 12px}
.stage[data-comp=tablet] .t-sun,.stage[data-comp=tablet] .t-battery{width:214px}
.stage[data-comp=tablet] .t-praktijk,.stage[data-comp=tablet] .t-net,.stage[data-comp=tablet] .t-cupra{width:190px}
.stage[data-comp=tablet] .t-val{font-size:23px;margin-top:2px}
.stage[data-comp=tablet] .t-icon{width:22px;height:22px}
.stage[data-comp=tablet] .t-name{font-size:13px}
.stage[data-comp=tablet] .t-sub{font-size:12px;white-space:normal;line-height:1.25}
.stage[data-comp=tablet] .t-house .t-val{font-size:20px}
.stage[data-comp=tablet] .t-battery .t-sub,.stage[data-comp=tablet] .t-house .t-sub{display:none}
.stage[data-comp=tablet] .t-simshort{display:block}

/* mobile: pods sized in % so anchors stay true at 320 and 390 */
.stage[data-comp=mobile]{border-radius:20px}
.stage[data-comp=mobile] .tile{padding:9px 10px;border-radius:14px;gap:1px}
.stage[data-comp=mobile] .t-sun,.stage[data-comp=mobile] .t-battery{width:46%}
.stage[data-comp=mobile] .t-praktijk,.stage[data-comp=mobile] .t-net,.stage[data-comp=mobile] .t-cupra{width:31.5%;padding:9px 8px;text-align:center}
.stage[data-comp=mobile] .t-praktijk .t-head,.stage[data-comp=mobile] .t-net .t-head,.stage[data-comp=mobile] .t-cupra .t-head{flex-direction:column;gap:3px}
.stage[data-comp=mobile] .t-icon{width:22px;height:22px}
.stage[data-comp=mobile] .t-name{font-size:12.5px}
.stage[data-comp=mobile] .t-val{font-size:clamp(16px,5.2vw,21px);margin-top:2px}
.stage[data-comp=mobile] .t-sub{font-size:11px;white-space:normal;line-height:1.25}
.stage[data-comp=mobile] .t-tag{font-size:10.5px;padding:1px 6px}
.stage[data-comp=mobile] .t-bar{margin-top:4px;height:5px}
.stage[data-comp=mobile] .t-house{padding:7px 12px 7px 9px;gap:8px}
.stage[data-comp=mobile] .t-house .t-icon{width:22px;height:22px}
.stage[data-comp=mobile] .t-house .t-val{font-size:19px}
.stage[data-comp=mobile] .t-house .t-name{font-size:11.5px}
.stage[data-comp=mobile] .t-house .t-sub{display:none}
.stage[data-comp=mobile] .t-battery .t-sub,.stage[data-comp=mobile] .t-tag{display:none}
.stage[data-comp=mobile] .t-simshort{display:block}

@media (max-width:720px){
  .wrap{padding:max(10px,env(safe-area-inset-top)) 12px 24px}
  h1{font-size:21px}
  h1 span{display:block;margin:0;font-size:16px}
  .brand-icon{width:30px;height:30px}
  .head-right{gap:10px}
  time{display:none}
  .pill{min-height:44px;padding:0 14px;font-size:13px}
  .band{font-size:13px;padding:8px 12px}
  .summary{font-size:15.5px;margin:12px 2px 4px}
  .below{grid-template-columns:1fr;gap:12px}
  .legend ul{grid-template-columns:1fr}
}
@media (max-width:340px){
  .stage[data-comp=mobile] .t-name{font-size:11.5px}
  .stage[data-comp=mobile] .t-praktijk,.stage[data-comp=mobile] .t-net,.stage[data-comp=mobile] .t-cupra{padding:8px 4px}
}

/* ---------- sheet ---------- */
.backdrop{position:fixed;inset:0;background:rgba(2,5,10,.55);opacity:0;transition:opacity .25s;z-index:40}
.backdrop.open{opacity:1}
.sheet{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(440px,100vw);background:linear-gradient(180deg,#0E1B2C,#09121F);border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.open{transform:none}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px}
.sheet h2{margin:0;font-size:22px;letter-spacing:-.01em}
.close{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;font-size:20px}
.sheet-body{overflow:auto;padding:4px 20px 28px}
.sheet h3{font-size:14px;color:var(--ink2);margin:20px 0 6px;font-weight:650}
.sheet dl{margin:0}
.row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14.5px}
.row dt{color:var(--ink2)}.row dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;word-break:break-word}
.note{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:14px;color:var(--ink2);margin:6px 0 10px}
.note.demo{background:#B07CFF1C;border-color:#B07CFF66;color:#E3D2FF;font-weight:600}
.note.sim{background:#B07CFF14;border-color:#B07CFF55;color:#E3D2FF}
.lead{font-size:16px;line-height:1.45;margin:4px 0 10px}
@media (max-width:720px){
  .sheet{top:auto;left:0;width:100%;max-height:72vh;border-left:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;transform:translateY(100%);padding-bottom:env(safe-area-inset-bottom)}
}

/* ---------- review bar (preview only, not part of the cockpit) ---------- */
.review{margin:28px 0 0;padding:14px 16px;border-radius:14px;border:1px dashed rgba(255,255,255,.18);color:var(--ink2);font-size:14px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.review strong{color:var(--ink)}
.review label{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.review select{min-width:0;flex:1 1 auto;min-height:40px;background:#0B1624;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;max-width:100%}
.review input{width:20px;height:20px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.stage.rm .route .r-glow{transition:none}
</style>
</head>
<body>
<div class="wrap">
  <main id="host" aria-label="Energiehuis Live Cockpit"></main>
  <p id="live" class="sr-only" aria-live="polite"></p>
  <section class="review" aria-label="Beoordelingspaneel, alleen in deze preview">
    <strong>Beoordelingspaneel (alleen preview)</strong>
    <label>Bron <select id="modeSel"><option value="demo">DEMO, fictief</option><option value="test">TEST, gesimuleerde HA-states</option></select></label>
    <label>Scenario <select id="scSel"></select></label>
    <label><input type="checkbox" id="rmBox"> Beweging verminderen</label>
  </section>
</div>
<div class="backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <header><h2 id="sheetTitle"></h2><button type="button" class="close" aria-label="Sluiten">✕</button></header>
  <div class="sheet-body"></div>
</section>
<script>
/* ---- readings-engine.cjs ---- */
/* Energiehuis Premium Cockpit · laag 1: sensordata en validatie.
 * Puur: geen DOM, geen Home Assistant-aanroepen, geen opslag. Werkt in Node (require) en browser (globalThis.EhReadings).
 * Zet een HA-state om in een Reading met één van zeven toestanden. Strenger dan legacy ehW:
 * een ontbrekende eenheid is hier 'invalid-unit' in plaats van stilzwijgend W.
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.EhReadings = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const STATES = Object.freeze(['live', 'live-zero', 'retained', 'stale', 'unknown', 'invalid-unit', 'unlinked']);
  const ZERO_W = 30;
  const FUTURE_TOLERANCE_MS = 120000;
  const UNAVAILABLE = new Set(['', 'unknown', 'unavailable', 'none', 'null', 'nan']);

  function parseNumber(raw) {
    if (typeof raw === 'number') return Number.isFinite(raw) ? raw : null;
    if (typeof raw !== 'string') return null;
    const s = raw.trim();
    if (UNAVAILABLE.has(s.toLowerCase())) return null;
    if (!/^[-+]?(\d+([.,]\d+)?|[.,]\d+)$/.test(s)) return null;
    const n = Number(s.replace(',', '.'));
    return Number.isFinite(n) ? n : null;
  }

  function stampOf(state) {
    for (const key of ['last_reported', 'last_updated', 'last_changed']) {
      const t = Date.parse(state?.[key] || '');
      if (Number.isFinite(t)) return { t, source: key };
    }
    return { t: NaN, source: null };
  }

  /**
   * spec: { key, entity, kind: 'power'|'percent', ttlS, stable }
   * returns a frozen Reading.
   */
  function readEntity(hass, spec, now) {
    const base = { key: spec.key, entity: spec.entity || null, kind: spec.kind, value: null, ageMs: null, stampSource: null, reason: '' };
    const done = (state, extra) => Object.freeze({ ...base, ...extra, state });
    if (!spec.entity) return done('unlinked', { reason: 'Nog niet gekoppeld' });
    const st = hass?.states?.[spec.entity];
    if (!st) return done('unknown', { reason: 'Entiteit niet gevonden' });
    const value = parseNumber(st.state);
    if (value === null) return done('unknown', { reason: 'Geen geldige waarde (' + String(st.state) + ')' });

    let normalized = value;
    const unit = String(st.attributes?.unit_of_measurement ?? '').trim().toLowerCase();
    if (spec.kind === 'power') {
      if (unit === 'kw') normalized = value * 1000;
      else if (unit !== 'w') return done('invalid-unit', { reason: unit ? 'Onbekende eenheid ' + unit : 'Eenheid ontbreekt' });
    } else if (spec.kind === 'percent') {
      if (unit !== '%') return done('invalid-unit', { reason: unit ? 'Onbekende eenheid ' + unit : 'Eenheid ontbreekt' });
      if (value < 0 || value > 100) return done('unknown', { reason: 'Buiten 0–100 %' });
    }

    const { t, source } = stampOf(st);
    const age = now - t;
    if (!Number.isFinite(t) || age < -FUTURE_TOLERANCE_MS) {
      return done('stale', { reason: 'Tijdstempel onbekend', stampSource: source });
    }
    const ageMs = Math.max(0, age);
    if (ageMs > spec.ttlS * 1000) {
      if (spec.stable) return done('retained', { value: normalized, ageMs, stampSource: source, reason: 'Laatst bekend · ' + ageLabel(ageMs) });
      return done('stale', { ageMs, stampSource: source, reason: 'Verouderd · ' + ageLabel(ageMs) });
    }
    if (spec.kind === 'power' && Math.abs(normalized) < ZERO_W) {
      return done('live-zero', { value: normalized, ageMs, stampSource: source, reason: 'Actueel' });
    }
    return done('live', { value: normalized, ageMs, stampSource: source, reason: 'Actueel' });
  }

  function isCurrent(r) { return !!r && (r.state === 'live' || r.state === 'live-zero'); }
  function hasValue(r) { return !!r && (isCurrent(r) || r.state === 'retained'); }

  function ageLabel(ms) {
    if (!Number.isFinite(ms) || ms < 0) return 'tijd onbekend';
    const m = Math.floor(ms / 60000);
    if (m < 1) return 'zojuist';
    if (m < 60) return m + ' min';
    const h = Math.floor(m / 60);
    if (h < 24) return h + ' uur';
    const d = Math.floor(h / 24);
    return d + (d === 1 ? ' dag' : ' dagen');
  }

  /** Magnitude only: callers decide the direction word. Never prints a minus sign. */
  function formatPower(w) {
    if (!Number.isFinite(w)) return '—';
    const a = Math.abs(w);
    if (a < 1000) return String(Math.round(a / 10) * 10) + ' W';
    return (a / 1000).toFixed(2).replace('.', ',') + ' kW';
  }

  return Object.freeze({ STATES, ZERO_W, parseNumber, readEntity, isCurrent, hasValue, ageLabel, formatPower });
});

/* ---- flow-model-engine.cjs ---- */
/* Energiehuis Premium Cockpit · laag 2: energieflowmodel.
 * Puur: Readings + verificatieflags + vorig model -> routes, richting, integriteit, labels.
 * De animatielaag mag alleen routes tonen die hier active=true zijn. Zo kan geen visuele laag
 * de meetbeveiliging omzeilen. De virtuele batterij is nooit een route.
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;

      const f = [...sheet.querySelectorAll('button,[href],[tabindex]:not([tabindex="-1"])')];
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });

  // ---------------- tick ----------------
  const live = document.getElementById('live');
  function tick(force) {
    const now = Date.now();
    let input;
    if (state.source === 'demo') {
      input = { now, mode: 'demo', readings: S.demoReadings(state.scenario, now) };
      state.entities = Object.fromEntries(Object.keys(S.ENTITIES).map(k => [k, 'demo.' + k]));
    } else {
      const t = S.testReadings(state.scenario, now);
      state.entities = t.entities;
      input = { now, mode: 'live', readings: t.readings, trust: t.trust, connected: t.connected };
      if (!state.model && t.warmupMs) state.model = F.computeModel({ ...input, now: now - t.warmupMs }, null);
    }
    state.model = F.computeModel(input, state.model);
    renderHost(state.model);
    updateIsland(state.model);
    if (!sheet.hidden) renderSheet();
    if (force || (state.model.summary !== state.lastLiveText && now - state.lastLiveAt > 30000)) {
      live.textContent = (state.source === 'demo' ? 'Demo. ' : 'Testdata. ') + state.model.summary;
      state.lastLiveText = state.model.summary; state.lastLiveAt = now;
    }
  }

  // ---------------- review bar (preview only) ----------------
  const modeSel = document.getElementById('modeSel'), scSel = document.getElementById('scSel'), rmBox = document.getElementById('rmBox');
  function fillScenarios() {
    const list = state.source === 'demo' ? S.DEMO : S.TEST;
    scSel.innerHTML = Object.entries(list).map(([k, v]) => '<option value="' + k + '"' + (k === state.scenario ? ' selected' : '') + '>' + esc(v.label) + '</option>').join('');
  }
  modeSel.value = state.source; rmBox.checked = state.forceReducedMotion; fillScenarios();
  modeSel.addEventListener('change', () => { state.source = modeSel.value; state.scenario = state.source === 'demo' ? 'teruglevering' : 'avond'; state.model = null; fillScenarios(); tick(true); syncUrl(); });
  scSel.addEventListener('change', () => { state.scenario = scSel.value; state.model = null; tick(true); syncUrl(); });
  rmBox.addEventListener('change', () => { state.forceReducedMotion = rmBox.checked; island.classList.toggle('rm', reducedMotion()); particles.kick(); syncUrl(); });
  mqReduce.addEventListener?.('change', () => { island.classList.toggle('rm', reducedMotion()); particles.kick(); });
  function syncUrl() { const p = new URLSearchParams({ mode: state.source, scenario: state.scenario }); if (state.forceReducedMotion) p.set('rm', '1'); history.replaceState(null, '', '?' + p); }

  island.classList.toggle('rm', reducedMotion());
  tick(true);
  new ResizeObserver(() => applyLayout()).observe(island);
  applyLayout();
  updateIsland(state.model);
  setInterval(() => tick(false), 1000);

  // Test hooks (read-only).
  window.__eh = { state, particles, island, rerender: n => { for (let i = 0; i < n; i++) tick(false); }, applyLayout };
})();

</script>
