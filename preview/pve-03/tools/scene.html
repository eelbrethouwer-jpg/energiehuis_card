</script>

<body>
<!--
  Energiehuis PVE-03 — offline scènegenerator, versie 2 (naar de goedgekeurde referentie van 9 nov 2026).
  Bouwt een volledig eigen 3D-scène (geen foto's, geen logo's, geen externe modellen) en rendert
  tekstvrije beeldlagen. Wordt alleen door tools/render-scene.cjs gebruikt; NIET door de preview zelf.
  Alle texturen zijn procedureel (canvas + vaste seed), dus het resultaat is reproduceerbaar.
  Geen tekst, cijfers, merklogo's of kentekens in het beeld.
-->
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---------------------------------------------------------------- helpers
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function canvasTex(w, h, draw, { repeat = [1, 1], srgb = true } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]);
  t.anisotropy = 8; if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function noise(g, w, h, r, amt, size = 1) {
  const img = g.getImageData(0, 0, w, h), d = img.data;
  for (let y = 0; y < h; y += size) for (let x = 0; x < w; x += size) {
    const n = (r() - 0.5) * amt;
    for (let yy = 0; yy < size && y + yy < h; yy++) for (let xx = 0; xx < size && x + xx < w; xx++) { const i = ((y + yy) * w + x + xx) * 4; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  }
  g.putImageData(img, 0, 0);
}
const std = o => new THREE.MeshStandardMaterial(o);
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// ---------------------------------------------------------------- procedural textures
const TEX = {};
TEX.paintBrick = canvasTex(512, 512, (g, w, h) => {           // wit geschilderde baksteen
  const r = rng(11); g.fillStyle = '#d8d3cb'; g.fillRect(0, 0, w, h);
  const bw = 64, bh = 21;
  for (let y = 0, row = 0; y < h; y += bh, row++) for (let x = -(row % 2) * bw / 2; x < w; x += bw) {
    const v = 222 + (r() - 0.5) * 16; g.fillStyle = `rgb(${v},${v - 4},${v - 10})`; g.fillRect(x + 1.5, y + 1.5, bw - 3, bh - 3);
  }
  noise(g, w, h, r, 14, 2); noise(g, w, h, r, 8);
}, { repeat: [5, 6] });
TEX.darkBrick = canvasTex(512, 256, (g, w, h) => {
  const r = rng(12); g.fillStyle = '#26221f'; g.fillRect(0, 0, w, h);
  for (let y = 0, row = 0; y < h; y += 22, row++) for (let x = -(row % 2) * 32; x < w; x += 64) { const v = 48 + r() * 26; g.fillStyle = `rgb(${v + 10},${v * 0.8},${v * 0.7})`; g.fillRect(x + 2, y + 2, 60, 18); }
  noise(g, w, h, r, 20);
}, { repeat: [8, 1] });
TEX.roof = canvasTex(512, 512, (g, w, h) => {
  const r = rng(13); g.fillStyle = '#121316'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 28) { for (let x = (y / 28 % 2) * 20; x < w; x += 40) { const v = 26 + r() * 14; g.fillStyle = `rgb(${v},${v + 1},${v + 4})`; g.fillRect(x + 1, y + 1, 38, 25); } g.fillStyle = 'rgba(0,0,0,.65)'; g.fillRect(0, y + 24, w, 4); }
  noise(g, w, h, r, 12);
}, { repeat: [7, 5] });
TEX.wood = canvasTex(512, 512, (g, w, h) => {                 // warm verticaal hout (praktijk)
  const r = rng(14);
  for (let x = 0; x < w; x += 24) {
    const b = 118 + r() * 30; g.fillStyle = `rgb(${b + 34},${b * 0.74},${b * 0.5})`; g.fillRect(x, 0, 24, h);
    for (let k = 0; k < 26; k++) { g.strokeStyle = `rgba(60,30,12,${0.06 + r() * 0.12})`; g.lineWidth = 1 + r(); const xx = x + r() * 22; g.beginPath(); g.moveTo(xx, 0); g.bezierCurveTo(xx + r() * 5 - 2.5, h * 0.3, xx + r() * 5 - 2.5, h * 0.7, xx + r() * 3 - 1.5, h); g.stroke(); }
    g.fillStyle = 'rgba(20,10,4,.7)'; g.fillRect(x + 22.5, 0, 1.5, h);
  }
  noise(g, w, h, r, 14);
}, { repeat: [4, 1] });
TEX.charcoal = canvasTex(256, 256, (g, w, h) => {             // donkere garagebekleding
  const r = rng(15); g.fillStyle = '#17161a'; g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 16) { const v = 22 + r() * 8; g.fillStyle = `rgb(${v},${v},${v + 3})`; g.fillRect(x, 0, 15, h); }
  noise(g, w, h, r, 10);
}, { repeat: [10, 1] });
TEX.herring = canvasTex(1024, 1024, (g, w, h) => {            // visgraatverband klinkers
  const r = rng(16); g.fillStyle = '#2b2624'; g.fillRect(0, 0, w, h);
  const L = 64, S = 32;
  for (let i = -2; i < 20; i++) for (let j = -2; j < 40; j++) {
    const x = i * 2 * S + j * S - 200, y = j * S;
    const v = 70 + r() * 40, tint = r();
    g.fillStyle = `rgb(${v + 14 * tint},${v * 0.9},${v * 0.82})`;
    if ((i + j) % 2 === 0) g.fillRect(x + 1.5, y + 1.5, L - 3, S - 3); else g.fillRect(x + 1.5, y + 1.5, S - 3, L - 3);
  }
  noise(g, w, h, r, 18);
}, { repeat: [26, 26] });
TEX.wet = canvasTex(512, 512, (g, w, h) => {                  // ruwheid: plassen
  const r = rng(17); g.fillStyle = '#a8a8a8'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 70; i++) { const x = r() * w, y = r() * h, rad = 25 + r() * 90; const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, 'rgba(8,8,8,.95)'); gr.addColorStop(1, 'rgba(8,8,8,0)'); g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2); }
  noise(g, w, h, r, 30);
}, { repeat: [7, 7], srgb: false });
TEX.lawn = canvasTex(512, 512, (g, w, h) => {
  const r = rng(18); g.fillStyle = '#1c3016'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { const x = r() * w, y = r() * h, v = r(); g.strokeStyle = `rgba(${40 + v * 40},${70 + v * 60},${28 + v * 22},.55)`; g.beginPath(); g.moveTo(x, y); g.lineTo(x + r() * 3 - 1.5, y - 3 - r() * 5); g.stroke(); }
  noise(g, w, h, r, 16);
}, { repeat: [10, 10] });
TEX.panel = canvasTex(256, 512, (g, w, h) => {
  g.fillStyle = '#070b14'; g.fillRect(0, 0, w, h);
  const cw = w / 6, ch = h / 10;
  for (let y = 0; y < 10; y++) for (let x = 0; x < 6; x++) { const gr = g.createLinearGradient(x * cw, y * ch, (x + 1) * cw, (y + 1) * ch); gr.addColorStop(0, '#15203a'); gr.addColorStop(1, '#0a1020'); g.fillStyle = gr; g.fillRect(x * cw + 1.5, y * ch + 1.5, cw - 3, ch - 3); }
  g.strokeStyle = '#1b2234'; g.lineWidth = 6; g.strokeRect(0, 0, w, h);
});
TEX.honeycomb = canvasTex(256, 128, (g, w, h) => {
  g.fillStyle = '#050506'; g.fillRect(0, 0, w, h); g.strokeStyle = '#24262b'; g.lineWidth = 2;
  for (let y = 0; y < h + 12; y += 12) for (let x = (y / 12 % 2) * 7; x < w; x += 14) { g.beginPath(); for (let k = 0; k < 6; k++) { const a = Math.PI / 3 * k; g.lineTo(x + Math.cos(a) * 6, y + Math.sin(a) * 6); } g.closePath(); g.stroke(); }
});
function interior(seed, kind = 'living') {
  return canvasTex(512, 384, (g, w, h) => {
    const r = rng(seed);
    const warmBack = kind === 'practice' ? ['#fff4e2', '#f2dcc0', '#b89574'] : ['#ffd49a', '#e39a52', '#5a2f16'];
    const gr = g.createRadialGradient(w * (0.35 + r() * 0.3), h * 0.3, 10, w * 0.5, h * 0.5, w * 0.75);
    gr.addColorStop(0, warmBack[0]); gr.addColorStop(0.55, warmBack[1]); gr.addColorStop(1, warmBack[2]);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = kind === 'practice' ? 'rgba(160,130,100,.5)' : 'rgba(70,35,15,.55)'; g.fillRect(0, h * 0.78, w, h * 0.22);      // vloer
    if (kind === 'practice') {
      g.fillStyle = '#f7f1e8'; g.fillRect(w * 0.18, h * 0.55, w * 0.48, h * 0.07);                 // behandeltafel
      g.fillStyle = '#9b8f84'; g.fillRect(w * 0.22, h * 0.62, w * 0.03, h * 0.17); g.fillRect(w * 0.58, h * 0.62, w * 0.03, h * 0.17);
      g.fillStyle = '#4f7a3a'; g.beginPath(); g.ellipse(w * 0.84, h * 0.55, w * 0.06, h * 0.13, 0, 0, 7); g.fill();   // plant
      g.fillStyle = '#6b4a33'; g.fillRect(w * 0.81, h * 0.66, w * 0.06, h * 0.12);
      g.fillStyle = 'rgba(255,250,235,.9)'; g.beginPath(); g.ellipse(w * 0.4, h * 0.06, w * 0.16, h * 0.035, 0, 0, 7); g.fill(); // plafondlamp
    } else {
      g.fillStyle = 'rgba(45,22,10,.6)'; g.fillRect(w * (0.08 + r() * 0.3), h * 0.58, w * (0.3 + r() * 0.2), h * 0.22);       // bank/tafel
      g.fillStyle = 'rgba(255,236,200,.95)'; g.beginPath(); g.arc(w * (0.25 + r() * 0.5), h * 0.16, 12, 0, 7); g.fill();       // lamp
      g.fillStyle = 'rgba(40,70,30,.6)'; g.beginPath(); g.ellipse(w * 0.85, h * 0.58, 26, 50, 0, 0, 7); g.fill();
    }
    noise(g, w, h, r, 8);
  });
}

// ---------------------------------------------------------------- renderer / scene
const params = new URLSearchParams(location.search);
const LAYOUT = params.get('layout') || 'desktop';
const W = +params.get('w') || 2660, H = +params.get('h') || 1496;
const isMobile = LAYOUT === 'mobile';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.92;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x4a3436, 0.0055);

// Dramatische zonsonderganglucht: mauve bovenin, warm oranje/roze horizon, verlichte wolkenbanden.
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `varying vec3 vP;
    float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
    float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<6;i++){v+=a*n(p);p=p*2.07+vec2(1.3,.7);a*=.5;}return v;}
    void main(){
      float y = clamp(vP.y,-.1,1.);
      vec3 top = vec3(.09,.11,.26), mid = vec3(.48,.30,.38), hor = vec3(1.25,.58,.24), low = vec3(.5,.28,.2);
      vec3 c = mix(hor, mid, smoothstep(.02,.30,y)); c = mix(c, top, smoothstep(.28,.75,y)); c = mix(low, c, smoothstep(-.05,.02,y));
      vec2 dir = normalize(vP.xz + vec2(1e-4));
      float sun = max(0., dot(dir, normalize(vec2(-.55,-.83))));
      c += vec3(.7,.3,.1) * pow(sun, 6.) * smoothstep(.25, .0, y);
      vec2 uv = vP.xz / max(y + .14, .06) * vec2(.9, 1.6);
      float cl = fbm(uv * vec2(1., 1.6) + vec2(5.2, 1.1));
      float bands = smoothstep(.42, .7, cl) * smoothstep(.04, .12, y) * smoothstep(.85, .35, y);
      vec3 cloudLit = mix(vec3(1.3,.62,.38), vec3(.78,.46,.52), smoothstep(.08,.55,y));
      vec3 cloudDark = vec3(.17,.14,.24);
      float under = smoothstep(.62, .42, fbm(uv * 1.3 + vec2(.4, 2.)));
      c = mix(c, mix(cloudDark, cloudLit, under), bands * .85);
      gl_FragColor = vec4(c, 1.);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(400, 64, 32), skyMat));
const pmrem = new THREE.PMREMGenerator(renderer);
{ const env = new THREE.Scene(); env.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), skyMat.clone()));
  const warm = new THREE.Mesh(new THREE.PlaneGeometry(30, 8), new THREE.MeshBasicMaterial({ color: 0xffb070 })); warm.position.set(-10, 3, 30); warm.lookAt(0, 3, 0); env.add(warm);
  scene.environment = pmrem.fromScene(env, 0.02).texture; }
scene.environmentIntensity = 0.5;

scene.add(new THREE.HemisphereLight(0x7a6c98, 0x21170f, 0.5));
const dusk = new THREE.DirectionalLight(0xffa98a, 1.35); dusk.position.set(-35, 16, -20);
dusk.castShadow = true; dusk.shadow.mapSize.set(4096, 4096); Object.assign(dusk.shadow.camera, { left: -32, right: 32, top: 26, bottom: -26 }); dusk.shadow.bias = -0.0004; dusk.shadow.radius = 5;
scene.add(dusk);
const fill = new THREE.DirectionalLight(0x9aa8e0, 0.45); fill.position.set(18, 12, 30); scene.add(fill);

// ---------------------------------------------------------------- layout per compositie
const L0 = 0;
const L = isMobile
  ? { houseRot: -0.8, practice: [-4.9, 0, 10.6], practiceRot: 0.62, practiceScale: 0.6, carWorld: [3.3, 0, 13.0], carYaw: -2.5,
      cam: { pos: [0.3, 4.6, 34], look: [0.6, 1.2, 3.5], fov: 45 }, focus: 33 }
  : { houseRot: -0.8, practice: [-10.6, 0, 3.4], practiceRot: 0.42, practiceScale: 1, carLocal: [10.4, 0, 4.6], carYaw: -2.55,
      cam: { pos: [-3.0, 2.45, 23.5], look: [0.2, 3.65, 0], fov: 40 }, focus: 23 };

const ANCHOR = {};
const glints = [];
function glint(p, color, width, length, strength) { glints.push({ p: p.clone(), color, width, length, strength }); }
const CONTACT = canvasTex(256, 256, (g, w, h) => { const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2); gr.addColorStop(0, 'rgba(0,0,0,.9)'); gr.addColorStop(0.55, 'rgba(0,0,0,.5)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
function contact(parent, w, d, y = 0.02) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ map: CONTACT, transparent: true, depthWrite: false })); m.rotation.x = -Math.PI / 2; m.position.y = y; parent.add(m); return m; }

// ---------------------------------------------------------------- grond
{
  const pav = new THREE.Mesh(new THREE.PlaneGeometry(320, 320), new THREE.MeshPhysicalMaterial({ map: TEX.herring, roughnessMap: TEX.wet, roughness: 0.7, clearcoat: 0.85, clearcoatRoughness: 0.12, envMapIntensity: 1.5 }));
  pav.rotation.x = -Math.PI / 2; pav.receiveShadow = true; scene.add(pav);
  const lawn = std({ map: TEX.lawn, roughness: 1 });
  const pieces = isMobile ? [[-10, 10, 9, 8], [-60, -40, 120, 60]] : [[-14, 10.5, 12, 8], [-60, -40, 120, 60], [-3.6, 7.8, 3.4, 4.2]];
  for (const [x, z, w, d] of pieces) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), lawn); m.rotation.x = -Math.PI / 2; m.position.set(x, 0.012, z); m.receiveShadow = true; scene.add(m); }
}

// ---------------------------------------------------------------- vensters
function windowUnit(w, h, seed, frame, { mullions = 1, transoms = 0, kind = 'living', glow = 1.15, blinds = false } = {}) {
  const g = new THREE.Group();
  const tex = interior(seed, kind);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshPhysicalMaterial({ map: tex, emissiveMap: tex, emissive: 0xffffff, emissiveIntensity: glow, roughness: 0.08, clearcoat: 1, envMapIntensity: 0.6 }));
  glass.position.z = 0.012; g.add(glass);
  if (blinds) for (let y = h / 2 - 0.06; y > -h / 2; y -= 0.09) { const s = new THREE.Mesh(new THREE.BoxGeometry(w, 0.025, 0.01), std({ color: 0x8a5a33, emissive: 0x4a2a10, emissiveIntensity: 0.6 })); s.position.set(0, y, 0.03); g.add(s); }
  const t = 0.07, d = 0.12;
  const bar = (bw, bh, x, y) => { const m = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, d), frame); m.position.set(x, y, d / 2); m.castShadow = true; g.add(m); };
  bar(w + t * 2, t, 0, h / 2 + t / 2); bar(w + t * 2, t, 0, -h / 2 - t / 2); bar(t, h, -w / 2 - t / 2, 0); bar(t, h, w / 2 + t / 2, 0);
  for (let i = 1; i <= mullions; i++) bar(t * 0.6, h, -w / 2 + (w / (mullions + 1)) * i, 0);
  for (let i = 1; i <= transoms; i++) bar(w, t * 0.6, 0, -h / 2 + (h / (transoms + 1)) * i);
  return g;
}
function wallLamp(parent, x, y, z, rotY = 0) {
  const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.34, 0.12), std({ color: 0x121212, roughness: 0.4, metalness: 0.6 })); lamp.position.set(x, y, z + 0.06); parent.add(lamp);
  for (const s of [1, -1]) {
    const glow = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 0.05), new THREE.MeshBasicMaterial({ color: 0xffd9a0 })); glow.position.set(x, y + s * 0.175, z + 0.07); glow.rotation.x = s * Math.PI / 2; parent.add(glow);
    const sp = new THREE.SpotLight(0xffb470, 9, 4.2, 0.55, 0.65, 1.6); sp.position.set(x, y + s * 0.18, z + 0.16);
    const tgt = new THREE.Object3D(); tgt.position.set(x, y + s * 2.2, z + 0.05); parent.add(tgt); sp.target = tgt; parent.add(sp);
  }
}

// ---------------------------------------------------------------- woning (topgevel naar rechts, panelen op linker dakhelft)
const house = new THREE.Group(); house.rotation.y = L.houseRot; scene.add(house);
{
  const Lh = 11, D = 8.4, He = 3.5, Hr = 8.8;
  const wall = std({ map: TEX.paintBrick, roughness: 0.9, color: 0xf6f1ea });
  const plinth = std({ map: TEX.darkBrick, roughness: 0.95 });
  const frame = std({ color: 0x1d1f22, roughness: 0.45, metalness: 0.5 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(Lh, He, D), wall); body.position.y = He / 2; body.castShadow = body.receiveShadow = true; house.add(body);
  const pl = new THREE.Mesh(new THREE.BoxGeometry(Lh + 0.05, 0.45, D + 0.05), plinth); pl.position.y = 0.225; house.add(pl);
  // topgevels (vijfhoek boven de borstwering)
  const tri = new THREE.Shape(); tri.moveTo(-D / 2, 0); tri.lineTo(D / 2, 0); tri.lineTo(0, Hr - He); tri.closePath();
  for (const sx of [-1, 1]) { const gm = new THREE.Mesh(new THREE.ShapeGeometry(tri), wall); gm.rotation.y = sx * Math.PI / 2; gm.position.set(sx * Lh / 2, He, 0); gm.castShadow = gm.receiveShadow = true; house.add(gm); }
  // dakvlakken met overstek
  const over = 0.55, slopeLen = Math.hypot(D / 2 + over, Hr - He + 0.5), ang = Math.atan2(Hr - He + 0.5, D / 2 + over);
  const roofMat = std({ map: TEX.roof, roughness: 0.55, metalness: 0.2, color: 0xd0d4dc });
  for (const sz of [1, -1]) {
    const slab = new THREE.Mesh(new THREE.BoxGeometry(Lh + 0.7, 0.2, slopeLen), roofMat);
    slab.position.set(0, (He + Hr) / 2 - 0.2, sz * (D / 4 + over / 2 - 0.05)); slab.rotation.x = sz * ang; slab.castShadow = slab.receiveShadow = true; house.add(slab);
    if (sz === 1) {
      const pg = new THREE.Group(); pg.position.copy(slab.position); pg.rotation.x = ang; house.add(pg);
      const pm = new THREE.MeshPhysicalMaterial({ map: TEX.panel, roughness: 0.15, metalness: 0.4, clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: 1.8 });
      const pw = 1.05, plen = 1.7;
      for (let row = 0; row < 2; row++) for (let i = 0; i < 7; i++) { const pn = new THREE.Mesh(new THREE.BoxGeometry(pw, 0.05, plen), pm); pn.position.set(-4.6 + i * (pw + 0.05), 0.13, -1.9 + row * (plen + 0.05)); pn.castShadow = true; pg.add(pn); }
      pg.updateMatrixWorld(true);
      ANCHOR.pv = V(-1.4, 0.15, -1.0).applyMatrix4(pg.matrixWorld);
      // dakkapel onder de panelen

      const dw = 2.6, dh = 1.6, dd = 2.2;

function lofted(stations, segs, mat) {
  // stations: [{x, y0, y1, w0, w1, n}] ; sectie = superellips tussen y0..y1 met breedte w(y) lineair w0 (onder) -> w1 (boven)
  const pos = [], idx = [];
  for (const s of stations) for (let k = 0; k <= segs; k++) {
    const t = (k / segs) * Math.PI * 2;
    const c = Math.cos(t), sn = Math.sin(t);
    const zz = Math.sign(c) * Math.pow(Math.abs(c), 2 / s.n), yy = Math.sign(sn) * Math.pow(Math.abs(sn), 2 / s.n);
    const y = (s.y0 + s.y1) / 2 + yy * (s.y1 - s.y0) / 2;
    const wy = s.w0 + (s.w1 - s.w0) * ((yy + 1) / 2);
    pos.push(s.x, y, zz * wy);
  }
  const ring = segs + 1;
  for (let i = 0; i < stations.length - 1; i++) for (let k = 0; k < segs; k++) { const a = i * ring + k, b = a + ring; idx.push(a, b, a + 1, b, b + 1, a + 1); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setIndex(idx); geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; return m;
}

  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.1, 14), new THREE.MeshBasicMaterial({ color: 0xffd7a0 })); cap.position.set(x, 0.55, z); scene.add(cap);
  const pl = new THREE.PointLight(0xffb36b, 1.6, 3.6, 2); pl.position.set(x, 0.6, z); scene.add(pl);
  glint(V(x, 0, z + 0.1), 0xffc27a, 0.25, 2.6, 0.5);
}
// net-aansluiting: geen object, het anker ligt midden onder het huis aan de beeldrand
// ---------------------------------------------------------------- camera
const cam = new THREE.PerspectiveCamera(L.cam.fov, W / H, 0.1, 900);
cam.position.set(...L.cam.pos); cam.lookAt(V(...L.cam.look)); cam.updateMatrixWorld(true);

const STREAK = canvasTex(64, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.16, 'rgba(255,255,255,.95)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); const img = g.getImageData(0, 0, w, h); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) img.data[(y * w + x) * 4 + 3] *= Math.exp(-Math.pow((x - w / 2) / (w / 4.2), 2)); g.putImageData(img, 0, 0); });
for (const gl of glints) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(gl.width, gl.length), new THREE.MeshBasicMaterial({ map: STREAK, color: gl.color, transparent: true, opacity: gl.strength, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  m.rotation.x = -Math.PI / 2;
  const dir = V(cam.position.x - gl.p.x, 0, cam.position.z - gl.p.z).normalize();
  m.rotation.z = Math.atan2(dir.x, dir.z);
  m.position.set(gl.p.x + dir.x * gl.length * 0.42, 0.03, gl.p.z + dir.z * gl.length * 0.42);
  scene.add(m);
}

const rt = new THREE.WebGLRenderTarget(W, H, { samples: 4, type: THREE.HalfFloatType });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, cam));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.42, 0.6, 0.86));
composer.addPass(new OutputPass());
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
    float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
    void main(){ vec4 c=texture2D(tDiffuse,vUv); vec2 d=vUv-.5; float v=smoothstep(.9,.28,length(d*vec2(1.,.92)));
      c.rgb*=mix(.7,1.,v); c.rgb = mix(c.rgb, c.rgb*vec3(1.03,.98,1.02), .5); c.rgb+=(h(vUv*1200.)-.5)*.016; gl_FragColor=c; }`
}));
composer.render();

function project(v) { const p = v.clone().project(cam); return { x: +((p.x + 1) / 2).toFixed(4), y: +((1 - p.y) / 2).toFixed(4) }; }
window.__anchors = Object.fromEntries(Object.entries(ANCHOR).map(([k, v]) => [k, project(v)]));
window.__done = true;
</script>
