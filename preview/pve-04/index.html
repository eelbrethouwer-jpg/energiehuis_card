<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Energiehuis Live Cockpit — PVE-04 DEMO</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page">
  <p class="page-note"><strong>DEMO — fictieve meetwaarden.</strong> Zelfstandige preview zonder Home Assistant-verbinding, zonder bediening en zonder opslag. Niet de productiekaart.</p>
  <div id="mount"></div>
</main>
<script src="scene-manifest.js"></script>
<script src="manifest-validate.js"></script>
<script src="model.js"></script>
<script src="flows.js"></script>
<script src="app.js"></script>
<script src="master-scene.js"></script>
<script src="master.js"></script>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var n = Math.max(1, Math.min(4, parseInt(q.get('instances') || '1', 10) || 1));
    var mount = document.getElementById('mount');
    // Testhaak: ?manifest=0 simuleert een ontbrekend scènemanifest (terugvalgedrag).
    // Testhaken (alleen voor de browsertests): ?manifest=0|null|invalid|v1|light
    var mq = q.get('manifest');
    if (mq === '0') { try { delete window.EhPve04Manifest; } catch (e) { window.EhPve04Manifest = undefined; } }
    if (mq === 'null') window.EhPve04Manifest = null;
    if (mq === 'invalid') { var bad = JSON.parse(JSON.stringify(window.EhPve04Manifest)); bad.compositions.desktop.base = []; bad.compositions.mobile.base[0].file = '../../etc/passwd.webp'; window.EhPve04Manifest = bad; }
    if (mq === 'v1') { var v1 = JSON.parse(JSON.stringify(window.EhPve04Manifest)); v1.schema = 'energiehuis.scene-manifest/1'; delete v1.coordinateSystem; ['desktop', 'mobile'].forEach(function (k) { var c = v1.compositions[k]; delete c.uiZones; delete c.keyObjects; delete c.protectedAreas; delete c.lightLayers; delete c.outOfView; }); window.EhPve04Manifest = v1; }
    if (mq === 'light') { var lm = JSON.parse(JSON.stringify(window.EhPve04Manifest)); ['desktop', 'mobile'].forEach(function (k) { var c = lm.compositions[k], b = c.base[0]; c.lightLayers = [Object.assign({}, b, { id: 'test-always', blend: 'screen', trigger: 'always' }), Object.assign({}, b, { id: 'test-future', blend: 'screen', trigger: 'practice-linked', futureField: true })]; }); window.EhPve04Manifest = lm; }
    window.__cockpits = [];
    function mountAll(extra) {
      for (var i = 0; i < n; i++) {
        window.__cockpits.push(EhPve04.createCockpit(mount, Object.assign({
          scenario: q.get('scenario') || (i ? 'net-laden' : 'zon-export'),
          ticker: q.get('ticker') !== '0',
          maskMode: q.get('maskmode') || undefined,
          svgMask: q.get('svgmask') === '0' ? false : undefined
        }, extra || {})));
      }
      window.__mounted = true;
    }
    // Standaard (PVE-04): de goedgekeurde master als vaste achtergrond (master.js). De eerdere placeholder-cockpit
    // blijft beschikbaar voor regressietests via ?scene=placeholder (en ?scene=private voor de privélaag).
    var sceneQ = q.get('scene');
    if (sceneQ !== 'placeholder' && sceneQ !== 'private') {
      if (q.get('masterScene') === '0') window.EhPve04MasterScene = null;   // testhaak: master-scène ontbreekt
      for (var j = 0; j < n; j++) {
        window.__cockpits.push(EhPve04Master.createMasterCockpit(mount, {
          scenario: q.get('scenario') || (j ? 'net-laden' : 'zon-export'),
          ticker: q.get('ticker') !== '0',
          base: q.get('masterBase') === 'missing' ? 'bestaat-niet/' : ''
        }));
      }
      window.__mounted = true;
      return;
    }
    // Privébeeldlaag (opt-in): ?scene=private laadt een privémanifest dat NIET in de repository staat
    // (standaard private/scene-manifest.private.js; in Home Assistant bijv. /local/energiehuis/pve04/…).
    // Ontbreekt of faalt het, dan valt de cockpit per compositie terug op het publieke placeholderbeeld.
    if (q.get('scene') === 'private') {
      var url = q.get('privateManifest') || 'private/scene-manifest.private.js';
      var publicMf = window.EhPve04Manifest;
      var done = function () { mountAll({ manifest: window.EhPve04PrivateManifest || null, fallbackManifest: publicMf, privateRequested: true }); };
      if (!EhPve04ManifestValidate.safeManifestUrl(url)) { done(); return; }
      var s = document.createElement('script');
      s.src = url; s.onload = done; s.onerror = done;
      document.body.appendChild(s);
    } else mountAll();
  })();
</script>
</body>
</html>
