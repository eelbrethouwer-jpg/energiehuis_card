# RETIRED: no automatic trigger, no write permission, and the publish job is disabled.
# Retained for historical audit; use the reviewed manual release process instead.
name: Publish Energiehuis v1.21.2 after validation
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  validate-and-release:
    if: ${{ false }} # Retired legacy publishing job; cannot run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check energiehuis-card.js
      - name: Run all Node regression tests
        run: node --test tests/*.test.cjs
      - name: Validate HACS metadata
        run: python -m json.tool hacs.json > /dev/null
      - name: Install Chromium dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate browser regressions
        run: |
          node tests/browser/stroomvergelijker.cjs
          node tests/browser/battery-finance.cjs
      - name: Verify final version
        run: |
          grep -Fq "const EH_VERSION = '1.21.2';" energiehuis-card.js
          test -f RELEASE_NOTES_v1.21.2.md
      - name: Publish if checks passed and release missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.21.2 >/dev/null 2>&1; then
            echo 'v1.21.2 already exists'
            exit 0
          fi
          gh release create v1.21.2 --target "$GITHUB_SHA" \
            --title "Energiehuis v1.21.2 – Cupra Insights volledige historische analyse" \
            --notes-file RELEASE_NOTES_v1.21.2.md --latest
