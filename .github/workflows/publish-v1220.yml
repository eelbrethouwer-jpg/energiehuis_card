name: Publish Energiehuis v1.22.0 after validation
on:
  push:
    branches: [main]
    paths: ['RELEASE_NOTES_v1.22.0.md']
permissions:
  contents: write
jobs:
  validate-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check energiehuis-card.js
      - name: Run all Node regression tests
        run: node --test tests/*.test.cjs
      - name: Validate HACS metadata
        run: python -m json.tool hacs.json > /dev/null
      - name: Install Chromium dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Validate browser regressions
        run: |
          node tests/browser/stroomvergelijker.cjs
          node tests/browser/battery-finance.cjs
          node tests/browser/personal-battery-comparison.cjs
      - name: Verify final version
        run: |
          grep -Fq "const EH_VERSION = '1.22.0';" energiehuis-card.js
          test -f RELEASE_NOTES_v1.22.0.md
      - name: Publish if checks passed and release missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.22.0 >/dev/null 2>&1; then
            echo 'v1.22.0 already exists'
            exit 0
          fi
          gh release create v1.22.0 --target "$GITHUB_SHA" \
            --title "Energiehuis v1.22.0 – Batterijvergelijker op jouw jaarverbruik" \
            --notes-file RELEASE_NOTES_v1.22.0.md --latest
