# RETIRED: no automatic trigger, no write permission, and the publish job is disabled.
# Retained for historical audit; use the reviewed manual release process instead.
name: Publish Energiehuis v1.21.0 after full validation
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  validate-and-release:
    if: ${{ false }} # Retired legacy publishing job; cannot run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check energiehuis-card.js
      - name: Run all Node regressions
        run: node --test tests/*.test.cjs
      - name: Validate HACS metadata
        run: python -m json.tool hacs.json > /dev/null
      - name: Install Chromium dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate old and new interfaces in Chromium
        run: |
          node tests/browser/stroomvergelijker.cjs
          node tests/browser/battery-finance.cjs
      - name: Verify final version and notes
        run: |
          grep -Fq "const EH_VERSION = '1.21.0';" energiehuis-card.js
          test -f RELEASE_NOTES_v1.21.0.md
      - name: Publish release only if missing and all checks passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.21.0 >/dev/null 2>&1; then
            echo 'v1.21.0 already exists'
            exit 0
          fi
          gh release create v1.21.0 --target "$GITHUB_SHA" \
            --title "Energiehuis v1.21.0 – Battery Dashboard Pro" \
            --notes-file RELEASE_NOTES_v1.21.0.md --latest
