name: Publish Energiehuis v1.29.0 — manual approval only

# Never publish on push or PR merge.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PUBLISH_v1.29.0 after explicit owner approval"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-energiehuis-v1.29.0
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_v1.29.0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release identity and notes
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          grep -Fq "const EH_VERSION = '1.29.0';" energiehuis-card.js
          grep -Fq "name:'Energiehuis v1.29.0'" energiehuis-card.js
          grep -Fq "function eh40Cockpit" energiehuis-card.js
          grep -Fq "function createController(card, cfg)" energiehuis-card.js
          grep -Fq "const EH_IMM_ROUTES" energiehuis-card.js
          grep -Fq 'function ehImmPlanningModel(' energiehuis-card.js
          test -s RELEASE_NOTES_v1.29.0.md
          python -m json.tool hacs.json > /dev/null
      - name: Verify build and syntax
        run: |
          node scripts/build.cjs --check
          node --check energiehuis-card.js
          node --check src/engines/battery-engine.cjs
          node --check src/engines/personal-evidence-engine.cjs
      - name: Node regressions UTC and Amsterdam
        run: |
          TZ=UTC node --test tests/*.test.cjs
          TZ=Europe/Amsterdam node --test tests/*.test.cjs
      - name: Install pinned Playwright browsers
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Run existing browser regressions and Immersive Live Cockpit in Chromium/WebKit
        run: |
          node tests/browser/charging-suggestions.cjs
          node tests/browser/mobile-visual.cjs
          node tests/browser/regisseur-cockpit.cjs
          EH_TEST_LIVE_TARIFFS=1 node tests/browser/stroomvergelijker.cjs
          node tests/browser/battery-finance.cjs
          node tests/browser/personal-battery-comparison.cjs
          node tests/browser/live-cockpit-home.cjs
          node tests/browser/live-cockpit-home.cjs --browser=webkit
          node tests/browser/live-cockpit-immersive.cjs
          node tests/browser/live-cockpit-immersive.cjs --browser=webkit

  publish:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_v1.29.0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refuse existing release or tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.29.0 >/dev/null 2>&1; then
            echo "::error::Release v1.29.0 already exists"; exit 1
          fi
          if test -n "$(git ls-remote --tags origin refs/tags/v1.29.0)"; then
            echo "::error::Tag v1.29.0 already exists"; exit 1
          fi
      - name: Publish validated main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.29.0 --target "$GITHUB_SHA" \
            --title "Energiehuis v1.29.0 – Landscape Home en HA-laadplanning" \
            --notes-file RELEASE_NOTES_v1.29.0.md --latest
