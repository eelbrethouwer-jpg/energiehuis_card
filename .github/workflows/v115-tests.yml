name: Energiehuis v1.15 multi-supplier regression
on:
  pull_request:
    paths:
      - 'energiehuis-card.js'
      - 'tests/**'
      - '.github/workflows/v115-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: node --check energiehuis-card.js
      - name: All Node regression tests
        run: node --test tests/*.test.cjs
      - name: Validate HACS configuration
        run: python -m json.tool hacs.json > /dev/null
