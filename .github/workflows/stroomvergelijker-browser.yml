name: Stroomvergelijker browsercontrole
on:
  pull_request:
    paths:
      - 'energiehuis-card.js'
      - 'tests/browser/**'
      - '.github/workflows/stroomvergelijker-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/stroomvergelijker.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stroomvergelijker-preview
          path: /tmp/energiehuis-stroomvergelijker.png
