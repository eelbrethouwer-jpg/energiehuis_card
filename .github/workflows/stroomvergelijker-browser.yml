name: Stroomvergelijker browsercontrole
on:
  # Run the full suite on every main push (including merges and docs-only changes).
  push:
    branches: [main]
  pull_request:
    paths:
      - 'energiehuis-card.js'
      - 'src/**'
      - 'scripts/build.cjs'
      - 'tests/**'
      - '.github/workflows/stroomvergelijker-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify generated HACS bundle
        run: node scripts/build.cjs --check
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install pinned Chromium and WebKit browsers
        timeout-minutes: 7
        run: npx playwright install --with-deps chromium webkit
      - name: Charging suggestions and control styling
        run: node tests/browser/charging-suggestions.cjs
      - name: Mobile visual acceptance
        run: node tests/browser/mobile-visual.cjs
      - name: EnergieRegisseur cockpit mobile & navigation
        run: node tests/browser/regisseur-cockpit.cjs
      - run: node tests/browser/stroomvergelijker.cjs
        env:
          EH_TEST_LIVE_TARIFFS: '1'
      - name: Test batterij 4.0 browser
        run: node tests/browser/battery-finance.cjs
      - name: Test persoonlijke batterijvergelijker
        run: node tests/browser/personal-battery-comparison.cjs
      - name: Live Cockpit Home (Chromium)
        run: node tests/browser/live-cockpit-home.cjs
      - name: Live Cockpit Home (WebKit / Safari-engine)
        run: node tests/browser/live-cockpit-home.cjs --browser=webkit
      - name: Immersive Live Cockpit Home + klikroutes (Chromium)
        run: node tests/browser/live-cockpit-immersive.cjs
      - name: Immersive Live Cockpit Home + klikroutes (WebKit / Safari-engine)
        run: node tests/browser/live-cockpit-immersive.cjs --browser=webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stroomvergelijker-preview
          path: |
            /tmp/energiehuis-charge-suggestions.png
            /tmp/eh-*.png
            /tmp/energiehuis-stroomvergelijker.png
            /tmp/energiehuis-aanbiederstarieven*.png
