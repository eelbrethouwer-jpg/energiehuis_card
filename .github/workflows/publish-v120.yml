name: Publish Energiehuis v1.20.0 after validation

on:
  push:
    branches: [main]
    paths:
      - 'RELEASE_NOTES_v1.20.0.md'

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch release commit
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check energiehuis-card.js
      - name: Run all regression tests
        run: node --test tests/*.test.cjs
      - name: Validate HACS metadata
        run: python -m json.tool hacs.json > /dev/null
      - name: Install Chromium test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate supplier and forecast battery dashboard in Chromium
        run: |
          node tests/browser/stroomvergelijker.cjs
          node tests/browser/battery-finance.cjs
      - name: Verify final version
        run: |
          grep -Fq "const EH_VERSION = '1.20.0';" energiehuis-card.js
          test -f RELEASE_NOTES_v1.20.0.md
      - name: Publish GitHub release (and tag) if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.20.0 >/dev/null 2>&1; then
            echo "v1.20.0 already exists; avoiding duplicate publication."
            exit 0
          fi
          gh release create v1.20.0 \
            --target "$GITHUB_SHA" \
            --title "Energiehuis v1.20.0 – Batterijvoorspelling en compact dashboard" \
            --notes-file RELEASE_NOTES_v1.20.0.md \
            --latest
