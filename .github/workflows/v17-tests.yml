name: Energiehuis v1.7.0 regressiecontrole

on:
  # Run the full suite on every main push (including merges and docs-only changes).
  push:
    branches: [main]
  pull_request:
    paths:
      - 'energiehuis-card.js'
      - 'src/**'
      - 'scripts/build.cjs'
      - 'tests/**'
      - '.github/workflows/v17-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, Europe/Amsterdam]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check energiehuis-card.js
      - name: Check standalone battery engine syntax
        run: node --check src/engines/battery-engine.cjs
      - name: Check standalone personal-evidence engine syntax
        run: node --check src/engines/personal-evidence-engine.cjs
      - name: Run functionality tests
        run: node --test tests/*.test.cjs
